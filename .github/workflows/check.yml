name: Foundation checks
on: [push, pull_request]
jobs:
  contracts-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r services/agent/requirements-dev.txt
      - run: npm run check
      - run: git diff --exit-code -- packages/contracts
      - run: npm test
      - run: npm run build

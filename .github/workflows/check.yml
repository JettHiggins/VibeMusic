name: Foundation checks
on: [push, pull_request]
jobs:
  contracts-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install -r services/agent/requirements-dev.txt
      - run: npm run check
      - run: git diff --exit-code -- packages/contracts
      - run: npm test
      - run: python -m pytest services/agent
      - run: npm run build
  firmware-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r services/agent/requirements-dev.txt
      - run: python3 scripts/build-engine.py --test
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        with:
          name: sloop-browser-engine
          path: apps/web/public/engine/
